<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hunt Music</title>
<link rel="stylesheet" href="shared/fonts.css">
<style>
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#46528a;color:#f6f0e4;font-family:Figtree,system-ui,sans-serif;text-align:center;padding:24px}
h1{font-weight:900;font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
p{margin:0 0 20px;opacity:.85}
a{display:inline-block;background:#d9532f;color:#f6f0e4;font-weight:800;text-decoration:none;padding:14px 26px;border-radius:999px;box-shadow:0 4px 0 #a83a1f}
</style></head><body>
<main><h1 id="h">Music on its way…</h1><p>Opening the playlist in Spotify.</p><a id="go" href="#">Open the playlist</a></main>
<script>
/* QR codes on the printed guides point here, so playlists can be changed any time without reprinting.
   Add one line per theme. */
var PLAYLISTS = {
  christmas: "https://open.spotify.com/playlist/3dw9hw3VKvr7ARef9mNAOj",
  halloween: "https://open.spotify.com/playlist/1foYTUQoQpL8unpxb1cMDR"
};
var LOOK = { // heading + colours per theme
  christmas: ["Christmas music on its way…", "#46528a", "#d9532f", "#a83a1f"],
  halloween: ["Spooky music on its way…", "#241b3b", "#e0702b", "#a94a17"]
};
var t = (new URLSearchParams(location.search).get("theme") || "christmas").toLowerCase();
var url = PLAYLISTS[t] || PLAYLISTS.christmas;
document.getElementById("go").href = url;
var look = LOOK[t] || LOOK.christmas, go = document.getElementById("go");
document.getElementById("h").textContent = look[0]; document.body.style.background = look[1];
go.style.background = look[2]; go.style.boxShadow = "0 4px 0 " + look[3];
setTimeout(function(){ location.replace(url); }, 400);
</script>
</body></html>
